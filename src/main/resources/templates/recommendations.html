<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Recommendations | The Music Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" th:href="@{/css/theme.css}" />
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="page-hero">
    <h1>Your recommendations</h1>
    <p>Based on the artists you love, here's what we think you should hear next.</p>
    <p class="recommendation-notice" th:if="${recommendationNotice}" th:text="${recommendationNotice}"></p>
</div>

<div class="recommend-grid">
    <div class="rec-card" th:each="artist : ${recommendations}">
        <img th:src="${artist.imgUrl}" alt="">
        <div class="rec-card-body">
            <h2 th:text="${artist.name + ' — ' + artist.genres}">Artist Name — Genre</h2>
            <p th:text="${artist.description}">Artist biography</p>
        </div>
        <div class="rec-card-video" th:data-embed="${artist.musicUrl}">
            <button type="button" class="video-play-btn" th:attr="aria-label='Play video: ' + ${artist.name}">
                <span class="play-icon">&#9658;</span>
            </button>
        </div>
    </div>
</div>

<a th:href="@{/}" class="back-link">
    <img th:src="@{/images/backarrow.png}" alt="">
    <span>Back to Home</span>
</a>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/recommendations.js}"></script>
</body>
</html>
