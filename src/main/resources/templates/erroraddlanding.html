<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Something's Missing | The Music Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" th:href="@{/css/theme.css}" />
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<section class="error-page">
    <div>
        <p class="error-code">Oops</p>
        <p class="error-message" th:text="${invalidInfo}">Please enter information in all required fields.</p>
        <form th:action="@{/form}" method="post">
            <button type="submit" class="btn btn-primary">Back to Sign Up</button>
        </form>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
