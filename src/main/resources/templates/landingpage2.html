<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Music Box | Discover Your Next Favorite Artist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" th:href="@{/css/theme.css}" />
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<section class="hero">
    <video autoplay muted loop playsinline class="hero-video">
        <source th:src="@{/images/BlackNGoldWelcome.mp4}" type="video/mp4">
    </video>
    <div class="hero-overlay"></div>
    <div class="hero-content">
        <span class="hero-eyebrow">Your musical matchmaker</span>
        <h1 class="hero-title">Discover your next favorite artist</h1>
        <p class="hero-subtitle">Tell us who you already love, and we'll introduce you to rising artists picked just for your taste.</p>
        <a th:href="@{/guest}" class="btn btn-primary btn-lg">Enter as Guest</a>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
