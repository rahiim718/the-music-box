<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | The Music Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" th:href="@{/css/theme.css}" />
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<section class="form-page">
    <video autoplay muted loop playsinline class="form-page-bg">
        <source th:src="@{/images/Elegant.mp4}" type="video/mp4">
    </video>
    <div class="form-page-overlay"></div>
    <div class="form-shell">
        <h1>Welcome back</h1>
        <p class="form-subtitle">Sign in to pick up where you left off.</p>
        <form th:action="@{/signinform}" method="post">
            <div class="form-field">
                <label for="emailAddress">Email Address</label>
                <input type="email" id="emailAddress" name="emailAddress" placeholder="you@example.com" required>
            </div>
            <div class="form-field">
                <label for="userPassword">Password</label>
                <input type="password" id="userPassword" name="userPassword" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
