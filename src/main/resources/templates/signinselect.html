<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pick Your Artists | The Music Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" th:href="@{/css/theme.css}" />
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="page-hero">
    <h1>Welcome back, <span th:text="${firstName}"></span>!</h1>
    <p>Select up to 3 of your favorite artists below.</p>
</div>

<form id="artistForm" method="post" th:action="@{/recommendations}" autocomplete="off" enctype="application/x-www-form-urlencoded">
    <div class="artist-container">
        <div class="artist" th:each="artist : ${featuredArtists}">
            <label>
                <div class="image-container">
                    <img th:src="@{/images/{imageUrl}(imageUrl=${artist.imageUrl})}" alt="" width="200">
                    <div class="genre" th:text="${artist.genre}"></div>
                </div>
                <input type="checkbox"
                       th:id="${artist.name}"
                       th:name="artist"
                       th:value="${artist.name + '|' + artist.genre}"
                       th:data-genre="${artist.genre}"
                       style="display: none;">
            </label>
            <div class="artist-name" th:text="${artist.name}">Artist</div>
        </div>
    </div>
    <div class="submit-button">
        <button type="submit" form="artistForm" class="btn btn-primary btn-lg">Get Recommendations</button>
    </div>
</form>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
