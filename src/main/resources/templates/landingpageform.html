<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | The Music Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" th:href="@{/css/theme.css}" />
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<audio id="bg-music" loop autoplay>
    <source th:src="@{/images/dont-stop-me.mp3}" type="audio/mp3">
</audio>

<section class="form-page">
    <video autoplay muted loop playsinline class="form-page-bg">
        <source th:src="@{/images/Audio_Seprectrum1.mp4}" type="video/mp4">
    </video>
    <div class="form-page-overlay"></div>
    <div class="form-shell">
        <h1>Create your account</h1>
        <p class="form-subtitle">Join The Music Box and start discovering new artists.</p>
        <form th:action="@{/landingpageform}" method="post">
            <div class="form-field">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" placeholder="First name" required>
            </div>
            <div class="form-field">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" placeholder="Last name" required>
            </div>
            <div class="form-field">
                <label for="emailAddress">Email Address</label>
                <input type="email" id="emailAddress" name="emailAddress" placeholder="you@example.com" required>
            </div>
            <div class="form-field">
                <label for="userPassword">Create Password</label>
                <input type="password" id="userPassword" name="userPassword" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
        </form>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/bg-music.js}" defer></script>
</body>
</html>
